name: Deploy VitePress to Cloudflare Pages

on:
  push:
    branches:
      - main


jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CF_PROJECT_NAME: ${{ vars.CF_PROJECT_NAME || 'rust-web-tutorial' }}

    permissions:
      contents: read


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm


      - name: Install
        run: pnpm install --frozen-lockfile


      - name: Build
        run: pnpm docs:build


      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy .vitepress/dist --project-name ${{ env.CF_PROJECT_NAME }}