# 第 23 章配套示例：2FA 两步验证 + 层级子账号与资源级授权。
# 这个 crate 把第 17 章 todo_api_saas 的扁平「租户 + admin/member」升级成真实 SaaS
# 的账号体系，复用了前面章节沉淀下来的三块机制：
# - argon2 密码哈希（第 17 章 auth.rs 的思路，绝不存明文）
# - jsonwebtoken 无状态鉴权 + AuthUser 提取器（第 17 章）
# - sqlx(postgres) + pg_advisory_xact_lock 幂等迁移（第 17 章 db.rs，本 crate 锁 id 用 47）
# 新引入的只有 totp-rs 一个 crate，用来做 RFC 6238 的时间型一次性密码（TOTP）。
[package]
name = "iam_demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# 与 todo_api_pg 相同：workspace 只声明公共 feature（runtime-tokio + tls-rustls），
# postgres 驱动 feature 由用到它的 crate 自己追加。
sqlx = { workspace = true, features = ["postgres"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
argon2 = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true }
# totp-rs：RFC 6238 时间型一次性密码。default-features=false 关掉默认的二维码图片依赖，
# 只留我们需要的两块——
# - otpauth：生成 otpauth:// URI（Google/Microsoft Authenticator 扫码就能识别）；
# - gen_secret：Secret::generate_secret() 随机生成密钥。
# 按任务约定「otpauth URI 文本返回即可」，不引 qrcode 图片 crate。
totp-rs = { version = "5", default-features = false, features = ["otpauth", "gen_secret"] }

[dev-dependencies]
# 集成测试用 axum 的内存直连（oneshot）发请求，无需真正监听端口。
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
