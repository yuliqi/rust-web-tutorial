# 第 20 章配套示例：数据库敏感字段加密存储。
# 依赖全部来自 workspace 已有声明，没有引入任何新 crate：
# - aes-gcm：字段级可逆加密（AEAD，加密 + 防篡改一体）
# - hmac + sha2：盲索引（blind index）用的 HMAC-SHA256
# - sqlx(postgres)：落库与查询，验证「密文列 + 盲索引列」的完整链路
[package]
name = "db_crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# 与 todo_api_pg 相同：workspace 只声明公共 feature（runtime-tokio + tls-rustls），
# postgres 驱动 feature 由用到它的 crate 自己追加。
sqlx = { workspace = true, features = ["postgres"] }
aes-gcm = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
