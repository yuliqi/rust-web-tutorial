<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实时监控仪表盘 · CPU / 内存 / 磁盘 + 告警</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0; padding: 1.5rem; line-height: 1.5;
      background: #f6f7f9; color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #e6e6e6; }
      .card { background: #21242b !important; border-color: #2f333c !important; }
      .bar { background: #2b2f37 !important; }
    }
    h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
    p.hint { margin: 0 0 1.2rem; color: #888; font-size: .9rem; }
    .status { font-size: .85rem; color: #888; margin-bottom: 1rem; }
    .dot { width: .6rem; height: .6rem; border-radius: 50%; background: #bbb; display: inline-block; margin-right: .3rem; }
    .dot.on { background: #2ecc71; } .dot.off { background: #e74c3c; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; padding: 1rem; }
    .card h2 { font-size: 1rem; margin: 0 0 .6rem; }
    .metric { margin-bottom: .7rem; }
    .metric .label { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: .2rem; }
    .metric .label .val { font-variant-numeric: tabular-nums; color: #555; }
    @media (prefers-color-scheme: dark) { .metric .label .val { color: #aaa; } }
    /* 用一个简单的进度条表达百分比：不引任何图表库，纯 CSS 宽度即可。
       生产大盘一般接 Grafana，或前端用 ECharts / Chart.js 画时序曲线。 */
    .bar { height: .55rem; background: #eef0f3; border-radius: 6px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: #3498db; transition: width .4s ease; }
    .bar > i.warn { background: #f39c12; }
    .bar > i.crit { background: #e74c3c; }
    .raw { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .8rem; color: #888; }
    #alerts .empty { color: #2ecc71; font-size: .9rem; }
    .alert { border-left: 4px solid #e74c3c; padding: .4rem .6rem; margin-bottom: .5rem; border-radius: 4px; background: rgba(231,76,60,.08); font-size: .85rem; }
    .alert.warning { border-left-color: #f39c12; background: rgba(243,156,18,.08); }
    .alert.info { border-left-color: #3498db; background: rgba(52,152,219,.08); }
    .alert .sev { font-weight: 600; text-transform: uppercase; font-size: .72rem; margin-right: .4rem; }
  </style>
</head>
<body>
  <h1>实时监控仪表盘</h1>
  <p class="hint">
    经 <b>SSE</b>（<code>/stream</code>）每 2 秒推一帧本机快照，浏览器自动重连。
    原始 Prometheus 文本见 <a href="/metrics">/metrics</a>，当前告警见 <a href="/alerts">/alerts</a>。
  </p>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">连接中……</span></div>

  <div class="grid">
    <div class="card">
      <h2>系统指标</h2>
      <div class="metric">
        <div class="label"><span>CPU 使用率</span><span class="val" id="cpuVal">--</span></div>
        <div class="bar"><i id="cpuBar"></i></div>
      </div>
      <div class="metric">
        <div class="label"><span>内存使用率</span><span class="val" id="memVal">--</span></div>
        <div class="bar"><i id="memBar"></i></div>
      </div>
      <div id="disks"></div>
      <div id="load" class="raw" style="margin-top:.6rem"></div>
    </div>

    <div class="card">
      <h2>当前告警</h2>
      <div id="alerts"><span class="empty">加载中……</span></div>
    </div>
  </div>

  <script>
    // —— DOM 小工具 ——
    const $ = (id) => document.getElementById(id);
    function setDot(on) {
      $('dot').className = 'dot ' + (on ? 'on' : 'off');
      $('statusText').textContent = on ? '已连接，实时刷新中' : '连接断开，浏览器自动重连中……';
    }
    function fmtBytes(n) {
      const u = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return n.toFixed(1) + ' ' + u[i];
    }
    // 百分比 → 进度条：越高越危险，颜色随之变黄变红（和告警阈值呼应）。
    function setBar(barId, valId, pct, suffix) {
      const p = Math.max(0, Math.min(100, pct));
      const bar = $(barId);
      bar.style.width = p + '%';
      bar.className = p >= 90 ? 'crit' : (p >= 75 ? 'warn' : '');
      $(valId).textContent = pct.toFixed(1) + (suffix || '%');
    }

    // 从一批指标里按名字（可选 label 过滤）取第一条的值。
    function pick(metrics, name, labelKey, labelVal) {
      const m = metrics.find((x) =>
        x.name === name &&
        (labelKey == null || (x.labels || []).some(([k, v]) => k === labelKey && v === labelVal)));
      return m ? m.value : null;
    }

    // —— 收到一帧快照就整屏重绘（幂等：同一帧重复画结果一样）——
    function render(snap) {
      const metrics = snap.metrics || [];

      const cpu = pick(metrics, 'cpu_usage_percent');
      if (cpu != null) setBar('cpuBar', 'cpuVal', cpu);

      const memPct = pick(metrics, 'memory_used_percent');
      const memUsed = pick(metrics, 'memory_used_bytes');
      const memTotal = pick(metrics, 'memory_total_bytes');
      if (memPct != null) {
        setBar('memBar', 'memVal', memPct);
        if (memUsed != null && memTotal != null) {
          $('memVal').textContent = memPct.toFixed(1) + '% (' + fmtBytes(memUsed) + ' / ' + fmtBytes(memTotal) + ')';
        }
      }

      // 磁盘：每个挂载点一条 disk_used_percent（用 label mount 区分）。
      const disks = metrics.filter((m) => m.name === 'disk_used_percent');
      $('disks').innerHTML = disks.map((m, i) => {
        const mount = (m.labels.find(([k]) => k === 'mount') || [null, '?'])[1];
        const id = 'disk' + i;
        return `<div class="metric">
          <div class="label"><span>磁盘 ${mount}</span><span class="val">${m.value.toFixed(1)}%</span></div>
          <div class="bar"><i id="${id}"></i></div></div>`;
      }).join('');
      disks.forEach((m, i) => {
        const bar = $('disk' + i);
        if (bar) { bar.style.width = Math.min(100, m.value) + '%'; bar.className = m.value >= 90 ? 'crit' : (m.value >= 75 ? 'warn' : ''); }
      });

      // 负载（类 Unix 才有意义；Windows 上为 0）。
      const l1 = pick(metrics, 'load_average', 'window', '1');
      const l5 = pick(metrics, 'load_average', 'window', '5');
      const l15 = pick(metrics, 'load_average', 'window', '15');
      if (l1 != null) $('load').textContent = `负载(1/5/15m): ${l1.toFixed(2)} / ${l5.toFixed(2)} / ${l15.toFixed(2)}`;

      // 告警。
      const alerts = snap.alerts || [];
      if (alerts.length === 0) {
        $('alerts').innerHTML = '<span class="empty">✓ 一切正常，无告警</span>';
      } else {
        $('alerts').innerHTML = alerts.map((a) =>
          `<div class="alert ${a.severity}"><span class="sev">${a.severity}</span>${a.message}</div>`).join('');
      }
    }

    // —— SSE：EventSource 自带自动重连，无需自己写 ——
    const es = new EventSource('/stream');
    es.onopen = () => setDot(true);
    es.onerror = () => setDot(false); // 浏览器会自动重连
    // 服务端把 kind 作为 event 名，这里监听 "snapshot"。
    es.addEventListener('snapshot', (e) => {
      try { render(JSON.parse(e.data)); setDot(true); } catch (err) { console.error(err); }
    });
    // 慢消费者丢帧时服务端会发 event=lagged，忽略即可（下一帧照常刷新）。
    es.addEventListener('lagged', () => console.warn('SSE lagged: 丢了若干帧'));
  </script>
</body>
</html>
