<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web 终端与堡垒机演示 · PTY over WebSocket</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0; padding: 1.5rem; line-height: 1.5;
      background: #f6f7f9; color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #e6e6e6; }
      input, button { background: #2b2f37; color: #e6e6e6; border-color: #3a3f49; }
      .term { background: #0b0d10 !important; color: #d6f5d6 !important; }
    }
    h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
    .warn {
      background: #fff3cd; color: #664d03; border: 1px solid #ffe69c;
      border-radius: 8px; padding: .6rem .8rem; font-size: .85rem; margin: 0 0 1rem;
    }
    .row { display: flex; gap: .5rem; margin-bottom: .8rem; flex-wrap: wrap; align-items: center; }
    input { flex: 1; min-width: 12rem; padding: .5rem .7rem; border: 1px solid #d0d4da; border-radius: 8px; font-size: 1rem; }
    button { padding: .5rem 1rem; border: 1px solid #d0d4da; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    button:hover { opacity: .85; }
    .dot { width: .6rem; height: .6rem; border-radius: 50%; background: #bbb; display: inline-block; }
    .dot.on { background: #2ecc71; } .dot.off { background: #e74c3c; }
    .term {
      background: #0b0d10; color: #d6f5d6; border-radius: 10px; padding: .8rem;
      height: 380px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
      font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .85rem;
    }
    .hint { color: #888; font-size: .85rem; margin: .6rem 0 0; }
  </style>
</head>
<body>
  <h1>Web 终端与堡垒机演示</h1>
  <div class="warn">
    ⚠️ 这是一个 <b>Web shell</b>：你在下面敲的命令会在服务器上真实执行。本页仅供本地教学，
    鉴权/授权/命令限制都是简化版，<b>切勿暴露到公网</b>。你的每一次输入与输出都会被
    <b>录制并写入审计库</b>（这正是堡垒机的意义）。
  </div>

  <div class="row">
    <span id="dot" class="dot"></span>
    <input id="token" placeholder="访问令牌（默认 dev-terminal-token）" value="dev-terminal-token" autocomplete="off" />
    <button id="connect">连接终端</button>
    <button id="audit">查看审计（/sessions）</button>
  </div>

  <div id="term" class="term"></div>

  <div class="row" style="margin-top:.8rem">
    <input id="cmd" placeholder="输入命令，回车发送（如 ls、pwd、echo hi）……" autocomplete="off" disabled />
    <button id="send" disabled>发送</button>
  </div>
  <p class="hint">
    生产的 Web 终端会用 <b>xterm.js</b> 这类前端库，逐键上行、完整渲染颜色与光标；
    本页为教学从简，用一个 &lt;div&gt; 显示输出、一个输入框整行发送。
    协议用 JSON 区分数据帧（<code>input</code>/<code>output</code>）与控制帧（<code>resize</code>）。
  </p>

  <script>
    const termEl = document.getElementById('term');
    const cmdEl = document.getElementById('cmd');
    const tokenEl = document.getElementById('token');
    let ws = null;

    function setDot(on) { document.getElementById('dot').className = 'dot ' + (on ? 'on' : 'off'); }
    function write(text) { termEl.textContent += text; termEl.scrollTop = termEl.scrollHeight; }

    function connect() {
      const token = tokenEl.value.trim();
      if (ws) { ws.close(); ws = null; }
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      // 浏览器 WebSocket 不能带 Authorization 头，令牌只能走查询参数（见 auth.rs 注释）。
      ws = new WebSocket(`${proto}://${location.host}/terminal/ws?token=${encodeURIComponent(token)}`);
      ws.onopen = () => {
        setDot(true); cmdEl.disabled = false; document.getElementById('send').disabled = false;
        write('\n[已连接终端]\n');
        // 上报一次窗口尺寸（控制帧）。真实前端会在窗口 resize 时持续上报。
        ws.send(JSON.stringify({ type: 'resize', rows: 30, cols: 100 }));
      };
      ws.onclose = () => { setDot(false); cmdEl.disabled = true; document.getElementById('send').disabled = true; write('\n[连接已关闭]\n'); };
      ws.onerror = () => setDot(false);
      ws.onmessage = (e) => {
        try {
          const m = JSON.parse(e.data);
          if (m.type === 'output') write(m.data);
          else if (m.type === 'error') write(`\n[错误] ${m.message}\n`);
        } catch { write(e.data); }
      };
    }

    function send() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      // 整行加换行发送，模拟按下回车。数据帧 type=input。
      ws.send(JSON.stringify({ type: 'input', data: cmdEl.value + '\n' }));
      cmdEl.value = '';
    }

    async function audit() {
      const token = tokenEl.value.trim();
      // 普通 HTTP 可以带 Authorization 头。
      const resp = await fetch('/sessions', { headers: { Authorization: 'Bearer ' + token } });
      if (!resp.ok) { write(`\n[审计] 请求失败：HTTP ${resp.status}\n`); return; }
      const rows = await resp.json();
      write('\n[审计] 最近会话：\n' + JSON.stringify(rows, null, 2) + '\n');
    }

    document.getElementById('connect').onclick = connect;
    document.getElementById('send').onclick = send;
    document.getElementById('audit').onclick = audit;
    cmdEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
