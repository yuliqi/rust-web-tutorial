# 第 14 章配套：一键启动本地中间件（仅用于学习，密码都是弱口令，别照搬上生产）
#
#   cd examples-middleware
#   docker compose up -d        # 启动全部
#   docker compose up -d redis  # 只启动某一个
#   docker compose down -v      # 停止并清空数据
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tutorial
      POSTGRES_PASSWORD: tutorial
      POSTGRES_DB: todos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorial -d todos"]
      interval: 2s
      timeout: 3s
      retries: 15

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: tutorial
      MYSQL_DATABASE: todos
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptutorial"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    # 本地学习免鉴权；生产必须开 TLS + 认证
    command:
      - etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"    # AMQP 协议端口
      - "15672:15672"  # 管理界面 http://localhost:15672 （guest/guest）
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 15
